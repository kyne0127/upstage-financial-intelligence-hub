[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-intelligence-hub"
version = "0.1.0"
description = "DART IR 분석 CLI — Financial Intelligence Hub (7개 계층형 AgentSkill 포함)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["upstage", "dart", "ir", "finance", "agent-skills", "cli"]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "python-Levenshtein>=0.25.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
fih = "src.cli:app"

[tool.hatch.build.targets.wheel]
include = [
    "src/**/*.py",
    "skills/**/*.md",
    "config/**/*.json",
    "fixtures/regression/**/*",
    "README.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
